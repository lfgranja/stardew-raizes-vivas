name: SDD Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  sdd-gate:
    name: sdd-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run aggregate CI gate (sdd + policy drift + protected paths + docs markers)
        run: bash scripts/ci/aggregate-gate.sh
