name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Quality Gate / static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      PYTHONPATH: scripts/quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: pip install -r scripts/quality-gate/requirements-ci.txt

      - name: Semgrep SARIF
        run: semgrep scan --config p/csharp --error --severity ERROR --metrics off --sarif --output semgrep.sarif LivingRoots/

      - name: Semgrep (file and line)
        if: always()
        run: semgrep scan --config p/csharp --error --severity ERROR --metrics off LivingRoots/

      - name: Upload Semgrep SARIF
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      - name: jscpd
        run: npx --yes jscpd@5.4.2 LivingRoots/ --format csharp --min-lines 5 --min-tokens 50 --reporters json --output jscpd-report --silent

      - name: Duplication gate
        run: python -m quality_gate duplication --report jscpd-report/jscpd-report.json --baseline .jscpd-baseline.json

      - name: Upload jscpd report
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: jscpd-report

  sca:
    name: Quality Gate / sca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: scripts/quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: pip install -r scripts/quality-gate/requirements-ci.txt

      - name: Trivy v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy.json
          skip-dirs: "**/bin/**,**/obj/**,**/.git/**"

      - name: Security gate
        run: python -m quality_gate security --report trivy.json

  codeql:
    name: Quality Gate / codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results.sarif

      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results.sarif

      - name: CodeQL annotations
        run: |
          python - <<'PY'
          import json, os
          path = "codeql-results.sarif"
          if not os.path.exists(path):
              raise SystemExit(0)
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  message = result.get("message", {}).get("text", "CodeQL finding")
                  for location in result.get("locations", []):
                      uri = location.get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
                      line = location.get("physicalLocation", {}).get("region", {}).get("startLine", 1)
                      print(f"::error file={uri},line={line}::{message}")
          PY

  build-analysis:
    name: Quality Gate / build-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GamePath: ${{ github.workspace }}/.gamepath
      BUILDDEPS_REPO: lfgranja/stardew-raizes-vivas-builddeps
      BUILDDEPS_TAG: gamepath-v1
      BUILDDEPS_ASSET: gamepath.zip
      PYTHONPATH: scripts/quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch build deps
        env:
          GH_TOKEN: ${{ secrets.BUILDDEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::BUILDDEPS_TOKEN is not set; cannot download the private build-deps release."
            exit 1
          fi
          mkdir -p "${GamePath}"
          gh release download "${BUILDDEPS_TAG}" \
              --repo "${BUILDDEPS_REPO}" \
              --pattern "${BUILDDEPS_ASSET}" \
              --dir "${GamePath}"
          unzip -o "${GamePath}/${BUILDDEPS_ASSET}" -d "${GamePath}"
          rm -f "${GamePath}/${BUILDDEPS_ASSET}"
          mkdir -p "${GamePath}/smapi-internal"
          mv -f "${GamePath}/SMAPI.Toolkit.CoreInterfaces.dll" \
                "${GamePath}/smapi-internal/"

      - name: Preflight - game assemblies
        run: |
          set -euo pipefail
          missing=0
          for required in \
              "Stardew Valley.dll" \
              "StardewModdingAPI.dll" \
              "StardewValley.GameData.dll" \
              "MonoGame.Framework.dll" \
              "xTile.dll" \
              "smapi-internal/SMAPI.Toolkit.CoreInterfaces.dll"
          do
            if [ ! -f "${GamePath}/${required}" ]; then
              echo "::error::missing ${required} under GamePath (${GamePath})"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::GamePath does not contain a usable Stardew Valley + SMAPI install."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test and coverage
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: ReportGenerator
        run: dotnet tool restore && dotnet reportgenerator -reports:'**/coverage.cobertura.xml' -targetdir:coverage-report -reporttypes:'JsonSummary;TextSummary'

      - name: Coverage gate
        run: python -m quality_gate coverage --summary coverage-report/Summary.json --baseline .coverage-baseline

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  gate:
    name: Quality Gate / gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, sca, build-analysis]
    if: always()
    permissions:
      contents: read
    env:
      PYTHONPATH: scripts/quality-gate
    steps:
      - name: Aggregate
        if: always()
        run: |
          static_result="${{ needs.static.result }}"
          sca_result="${{ needs.sca.result }}"
          build_result="${{ needs.build-analysis.result }}"
          result="success"
          for pair in "static:${static_result}" "sca:${sca_result}" "build-analysis:${build_result}"; do
            job="${pair%%:*}"
            value="${pair#*:}"
            if [ "${value}" != "success" ]; then
              result="failure"
              echo "::error::${job} concluded ${value}"
            fi
          done
          if [ "${result}" != "success" ]; then
            exit 1
          fi