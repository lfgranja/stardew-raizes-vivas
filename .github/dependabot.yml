version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directory: "/LivingRoots"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/LivingRoots.Tests"
    schedule:
      interval: "weekly"